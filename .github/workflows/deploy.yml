name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate intro audio (female voice)
        run: |
          pip install edge-tts
          python -m edge_tts --voice ar-SA-ZariyahNeural --text "مَرحبا طالباتٌ الابتدائية الثانية والاربعون" --write-media public/audio/welcome.mp3
          python -m edge_tts --voice ar-SA-ZariyahNeural --text "جاهزون للمسابقة" --write-media public/audio/ready.mp3

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          GITHUB_ACTIONS: true

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
